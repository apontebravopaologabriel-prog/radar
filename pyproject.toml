[project]
name = "radar-career-intelligence"
version = "1.0.2"
description = "Career intelligence local-first para el mercado laboral en Perú"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "mcp>=1.9,<2",
  "Pillow>=12.3,<13",
  "platformdirs>=4,<5",
  "fpdf2>=2.7,<3",
  "pypdfium2>=4.30,<6",
  "uvicorn>=0.30",
]

[project.scripts]
radar = "radar.cli:main"
radar-api = "radar.api:main"
radar-mcp = "radar.mcp.server:main"
radar-app = "radar.app:main"

[project.gui-scripts]
radar-desktop = "radar.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
desktop = [
  "pywebview>=5; sys_platform == 'win32'",
  "keyring>=25",
  "pyinstaller>=6",
]
jobspy = [
  "python-jobspy>=1.1.82",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
radar = ["help.md", "agent/soul.md", "careers/packs/*.json", "db/*.sql"]
