[project]
name = "radar-career-intelligence"
version = "0.1.0"
description = "Career Intelligence para ofertas de Ingeniería Industrial en Perú"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "mcp>=1.9,<2",
]

[project.scripts]
radar = "radar.cli:main"
radar-api = "radar.api:main"
radar-mcp = "radar.mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
jobspy = [
  "python-jobspy>=1.1.82",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
radar = ["help.md", "careers/packs/*.json", "db/*.sql"]
